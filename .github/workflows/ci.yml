name: CI
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, tests, clean room (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: SDL3 from the system
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl3-dev pkg-config || {
            echo "libsdl3-dev is not packaged on this runner; building SDL3 from source"
            sudo apt-get install -y cmake ninja-build libx11-dev libxext-dev libxcursor-dev \
              libxi-dev libxrandr-dev libxss-dev libwayland-dev libxkbcommon-dev \
              libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev libgl1-mesa-dev
            git clone --depth 1 --branch release-3.4.0 https://github.com/libsdl-org/SDL /tmp/sdl
            cmake -S /tmp/sdl -B /tmp/sdl/build -G Ninja -DCMAKE_BUILD_TYPE=Release
            sudo cmake --build /tmp/sdl/build --target install
            sudo ldconfig
          }
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # ROM tests skip when there is no ROM (none in CI).
      - run: cargo test
      - run: cargo run --bin sj-tools -- cleanroom

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build:
    name: build (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - name: SDL3 from the system (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl3-dev pkg-config
      # Windows and macOS: the sdl3 crate builds SDL3 from source and links it statically
      # (needs CMake, which the runners have).
      - run: cargo build --release --bin solar-jetman
      - uses: actions/upload-artifact@v4
        with:
          name: solar-jetman-${{ runner.os }}
          path: |
            target/release/solar-jetman
            target/release/solar-jetman.exe
          if-no-files-found: error

  wasm:
    name: wasm32-unknown-emscripten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-emscripten
      - uses: mymindstorm/setup-emsdk@v14
      - name: Library and app check
        run: cargo check --lib --bin solar-jetman --target wasm32-unknown-emscripten
      - name: Link the app (SDL3 from emscripten's port)
        env:
          RUSTFLAGS: -C link-arg=--use-port=sdl3 -C link-arg=-sASYNCIFY -C link-arg=-lidbfs.js
        run: cargo build --release --bin solar-jetman --target wasm32-unknown-emscripten
