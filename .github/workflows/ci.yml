name: CI
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, tests, clean room (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: SDL3
        run: tools/ci/install-sdl3.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # ROM tests skip when there is no ROM (none in CI).
      - run: cargo test
      - run: cargo run --bin sj-tools -- cleanroom

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build:
    name: build (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: SDL3 (Linux)
        if: runner.os == 'Linux'
        run: tools/ci/install-sdl3.sh
      # Windows and macOS: the sdl3 crate builds SDL3 from source and links it statically
      # (needs CMake, which the runners have).
      - run: cargo build --release --bin solar-jetman
      - uses: actions/upload-artifact@v4
        with:
          name: solar-jetman-${{ runner.os }}
          path: |
            target/release/solar-jetman
            target/release/solar-jetman.exe
          if-no-files-found: error

  wasm:
    name: wasm32-unknown-emscripten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
      - uses: mymindstorm/setup-emsdk@v14
      - name: Library and app check
        run: cargo check --lib --bin solar-jetman --target wasm32-unknown-emscripten
      # The same link as the Pages deploy (pages.yml); no ROM in CI, so no release scan.
      - name: Link the page (SDL3 from emscripten's port)
        env:
          SJ_SKIP_SCAN: 1
        run: tools/package/web.sh
